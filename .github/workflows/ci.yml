name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            illuminate: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            illuminate: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            illuminate: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.illuminate }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.illuminate }}-

      - run: >-
          composer update --no-install --no-scripts --no-plugins --no-interaction --prefer-dist
          --with="illuminate/support:${{ matrix.illuminate }}"
          --with="illuminate/http:${{ matrix.illuminate }}"
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --with-all-dependencies

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: composer test
      - run: composer lint
      - run: composer check-translations
